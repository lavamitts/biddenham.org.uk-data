    // Compare date strings in YYYY-MM-DD format
    function isTodayOrLater(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const d = new Date(dateStr);
      d.setHours(0, 0, 0, 0);

      return d >= today;
    }

    function formatDateVerbose(dateStr) {
        const date = new Date(dateStr);
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const day = date.getDate();

        // Get ordinal suffix for day number
        function ordinal(n) {
            if (n > 3 && n < 21) return 'th'; // 4-20 is always 'th'
            switch (n % 10) {
            case 1: return "st";
            case 2: return "nd";
            case 3: return "rd";
            default: return "th";
            }
        }

        const dayName = dayNames[date.getDay()];
        const suffix = ordinal(day);
        const monthName = date.toLocaleString('en-GB', { month: 'long' });

        return `${dayName}, ${day}${suffix} ${monthName}`;
    }

    const imageMap = {
      "General rubbish": "bin-grey.svg",

      "Recycling and garden": "bin-orange-green.svg",
