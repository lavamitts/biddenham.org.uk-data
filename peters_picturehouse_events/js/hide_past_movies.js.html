<script>
// 1. Signal JS is active immediately to avoid flicker
document.documentElement.classList.add('has-js');

document.addEventListener('DOMContentLoaded', () => {
    /**
     * @param {string} filterType - 'future' to remove past, 'past' to remove future.
     */
    function filterAllFilmContainers(filterType) {
        const filmRows = document.querySelectorAll('.picture-house-columns');
        if (filmRows.length === 0) return;

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        // Track the parent containers before we start removing their children
        const parentContainers = new Set();
        filmRows.forEach(row => parentContainers.add(row.parentNode));

        filmRows.forEach(row => {
            const dateElement = row.querySelector('div:first-child') || row;
            if (!dateElement) return;

            let dateText = dateElement.textContent.includes(',')
                ? dateElement.textContent.split(',')[1]
                : dateElement.textContent;

            dateText = dateText.replace(/(\d+)(st|nd|rd|th)/i, '$1').trim();
            const rowDate = new Date(dateText);

            if (!isNaN(rowDate.getTime())) {
                let shouldRemove = false;

                if (filterType === 'future') {
                    if (rowDate < today) shouldRemove = true;
                } else if (filterType === 'past') {
                    if (rowDate > today) shouldRemove = true;
                }

                if (shouldRemove) {
                    // Permanently delete the element from the DOM
                    row.remove();
                } else {
                    row.style.visibility = 'visible';
                }
            }
        });

        // Handle the "No movies" message placement
        parentContainers.forEach(container => {
            // Check if any matching rows are left inside this specific container
            const remainingRows = container.querySelectorAll('.picture-house-columns');

            // If zero rows remain, add the fallback message
            if (remainingRows.length === 0) {
                const message = document.createElement('p');
                message.innerHTML = '<strong>Upcoming movies to be announced.</strong>';

                // Since the rows are gone, safely append the message straight into the container
                container.appendChild(message);
            }
        });
    }

    // Call the function
    filterAllFilmContainers('future'); 
});
</script>
