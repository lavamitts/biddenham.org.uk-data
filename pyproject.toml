[project]
name = "biddenham-org-uk-data"
version = "0.1.0"
description = "Creates data for biddenham.org.uk, e.g. bin day data, on this day events"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "requests>=2.33.1",
    "colorama>=0.4.6",
    "et-xmlfile==2.0.0",
    "python-dotenv==1.1.1",
    "python-docx>=1.2.0",
    "pyperclip>=1.11.0",
]
