[project]
name = "biddenham-org-uk-data"
version = "0.1.0"
description = "Creates data for biddenham.org.uk, e.g. bin day data, on this day events"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "requests>=2.33.1",
    "colorama>=0.4.6",
    "et-xmlfile==2.0.0",
    "python-dotenv==1.1.1",
    "python-docx>=1.2.0",
    "pyperclip>=1.11.0",
    "pillow>=12.2.0",
    "playwright>=1.60.0",
    "google-genai>=2.6.0",
    "inquirer>=3.4.1",
    "rembg[cpu]>=2.0.75",
]

[tool.ruff]
line-length = 180

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.setuptools]
packages = [
    "biddenham_bin_days",
    "biddenham_conservation_volunteers",
    "biddenham_cricket_fixtures",
    "biddenham_on_this_day",
    "common",
    "cricket_badges",
    "event_builder",
    "fringe",
    "peters_picturehouse_events",
]
